<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2/dist/twilio.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #demo-wrap { display: flex; gap: 16px; align-items: flex-start; }

    /* ── cards ── */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 300px;
      text-align: center;
    }
    h1 { font-size: 20px; font-weight: 700; color: #1a202c; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #718096; margin-bottom: 24px; }

    /* ── login ── */
    input[type=password] {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; margin-bottom: 10px; outline: none;
    }
    input[type=password]:focus { border-color: #4299e1; }
    .btn {
      width: 100%; padding: 11px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #3182ce; color: #fff; }
    .error { color: #e53e3e; font-size: 12px; margin-top: 6px; min-height: 16px; }

    /* ── dial ── */
    .sdk-row { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-bottom: 20px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #a0aec0; }
    .dot.ready { background: #38a169; }
    .dot.error  { background: #e53e3e; }
    .status-badge {
      display: inline-block; padding: 4px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600; margin-bottom: 20px;
      background: #f7fafc; color: #4a5568;
    }
    .status-badge.active    { background: #fefcbf; color: #b7791f; }
    .status-badge.connected { background: #c6f6d5; color: #276749; }
    .dial-btn {
      width: 76px; height: 76px; border-radius: 50%; border: none;
      font-size: 30px; cursor: pointer;
      margin: 0 auto 10px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15); transition: transform .1s;
    }
    .dial-btn:active { transform: scale(0.95); }
    .dial-btn.idle   { background: #38a169; }
    .dial-btn.active { background: #e53e3e; }
    .dial-hint { font-size: 12px; color: #718096; }

    /* ── log panel ── */
    #log-panel {
      width: 560px;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      height: 460px;
    }
    #log-panel h2 {
      font-size: 14px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    #log-entries {
      flex: 1;
      overflow-y: auto;
      font-family: 'SF Mono', 'Monaco', 'Cascadia Code', monospace;
      font-size: 11px;
    }
    .log-entry { padding: 5px 0; border-bottom: 1px solid #f5f5f5; }
    .log-entry:last-child { border-bottom: none; }
    .log-meta { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
    .log-time { color: #b0b8c1; font-size: 10px; flex-shrink: 0; }
    .log-badge {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      color: #fff; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .03em; flex-shrink: 0;
    }
    .badge-call     { background: #3182ce; }
    .badge-cr       { background: #805ad5; }
    .badge-ai       { background: #38a169; }
    .badge-transfer { background: #dd6b20; }
    .badge-twiml    { background: #718096; }
    .badge-error    { background: #e53e3e; }
    .badge-clear    { background: #a0aec0; }
    .log-label { color: #2d3748; line-height: 1.4; }
    .log-detail {
      background: #f7fafc;
      border: 1px solid #e8edf2;
      border-radius: 4px;
      padding: 5px 8px;
      margin: 4px 0 2px 0;
      font-size: 10px;
      color: #4a5568;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 100px;
      overflow-y: auto;
    }
    .log-empty { color: #a0aec0; font-size: 12px; padding: 16px 0; text-align: center; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div id="demo-wrap">

  <!-- Login -->
  <div id="login-card" class="card" hidden>
    <h1>Teams Demo</h1>
    <p class="subtitle">Customer Experience Demo</p>
    <input type="password" id="pw" placeholder="Password" />
    <button class="btn btn-primary" onclick="doLogin()">Enter Demo</button>
    <div class="error" id="login-error"></div>
  </div>

  <!-- Dialler -->
  <div id="dial-card" class="card" hidden>
    <h1>Teams Demo</h1>
    <p class="subtitle">Voice SDK Client</p>
    <div class="sdk-row">
      <div class="dot" id="sdk-dot"></div>
      <span id="sdk-label">Initialising…</span>
    </div>
    <br>
    <span class="status-badge" id="status">Idle</span>
    <br>
    <button class="dial-btn idle" id="dial-btn" onclick="toggleCall()">📞</button>
    <div class="dial-hint" id="hint">Tap to call</div>
  </div>

  <!-- Live Log -->
  <div id="log-panel" hidden>
    <h2>📡 Live Activity</h2>
    <div id="log-entries">
      <div class="log-empty" id="log-empty">Waiting for a call…</div>
    </div>
  </div>

</div>

<script>
  let device = null, call = null, es = null;

  // ── auth ──────────────────────────────────────────────────────────────────
  async function init() {
    try {
      const r = await fetch('/token');
      if (r.status === 401) { show('login-card'); return; }
      const { token } = await r.json();
      show('dial-card');
      show('log-panel');
      setupDevice(token);
      connectLogStream();
    } catch { show('login-card'); }
  }

  async function doLogin() {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }),
    });
    if (r.ok) {
      document.getElementById('login-card').hidden = true;
      const { token } = await (await fetch('/token')).json();
      show('dial-card');
      show('log-panel');
      setupDevice(token);
      connectLogStream();
    } else {
      document.getElementById('login-error').textContent = 'Incorrect password';
    }
  }

  // ── Voice SDK ─────────────────────────────────────────────────────────────
  function setupDevice(token) {
    device = new Twilio.Device(token, { logLevel: 1 });
    device.on('registered', () => setSdk('ready', 'SDK Ready'));
    device.on('error',      (e) => { setSdk('error', 'SDK Error'); setStatus('Error: ' + e.message, ''); });
    device.register();
  }

  async function toggleCall() {
    if (call) { call.disconnect(); return; }
    setStatus('Connecting…', 'active');
    setBtn('active', '⏳', 'Connecting…');
    try {
      call = await device.connect();
      call.on('accept',     () => { setStatus('In call', 'connected'); setBtn('active', '📵', 'Hang up'); });
      call.on('disconnect', () => { call = null; setStatus('Call ended', ''); setBtn('idle', '📞', 'Tap to call'); setTimeout(() => setStatus('Idle', ''), 3000); });
      call.on('error',      (e) => { call = null; setStatus('Error: ' + e.message, ''); setBtn('idle', '📞', 'Tap to call'); });
    } catch (e) {
      call = null; setStatus('Failed', ''); setBtn('idle', '📞', 'Tap to call');
    }
  }

  // ── Live Log ──────────────────────────────────────────────────────────────
  const BADGE_COLORS = {
    call: 'badge-call', cr: 'badge-cr', ai: 'badge-ai',
    transfer: 'badge-transfer', twiml: 'badge-twiml',
    error: 'badge-error', clear: 'badge-clear',
  };

  function connectLogStream() {
    if (es) es.close();
    es = new EventSource('/log-stream');
    es.onmessage = (e) => {
      const event = JSON.parse(e.data);
      if (event.type === 'clear') { clearLog(); return; }
      addLogEntry(event);
    };
  }

  function clearLog() {
    const el = document.getElementById('log-entries');
    el.innerHTML = '<div class="log-empty" id="log-empty">New call started…</div>';
  }

  function addLogEntry({ ts, type, label, detail }) {
    const empty = document.getElementById('log-empty');
    if (empty) empty.remove();

    const time = new Date(ts).toLocaleTimeString('en-AU', { hour12: false });
    const badgeClass = BADGE_COLORS[type] || 'badge-twiml';

    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML =
      `<div class="log-meta">` +
        `<span class="log-time">${time}</span>` +
        `<span class="log-badge ${badgeClass}">${type}</span>` +
        `<span class="log-label">${escHtml(label)}</span>` +
      `</div>` +
      (detail ? `<pre class="log-detail">${escHtml(detail.trim())}</pre>` : '');

    const container = document.getElementById('log-entries');
    container.appendChild(entry);
    container.scrollTop = container.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── helpers ───────────────────────────────────────────────────────────────
  function show(id) { document.getElementById(id).hidden = false; }
  function setSdk(state, label) {
    document.getElementById('sdk-dot').className = 'dot ' + state;
    document.getElementById('sdk-label').textContent = label;
  }
  function setStatus(text, type) {
    const b = document.getElementById('status');
    b.textContent = text; b.className = 'status-badge ' + type;
  }
  function setBtn(state, icon, hint) {
    const b = document.getElementById('dial-btn');
    b.className = 'dial-btn ' + state; b.textContent = icon;
    document.getElementById('hint').textContent = hint;
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    init();
  });
</script>
</body>
</html>
