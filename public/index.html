<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2/dist/twilio.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #demo-wrap { display: flex; gap: 16px; align-items: stretch; }

    /* ── cards ── */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 300px;
      text-align: center;
    }
    h1 { font-size: 20px; font-weight: 700; color: #1a202c; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #718096; margin-bottom: 24px; }

    /* ── login ── */
    input[type=password] {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; margin-bottom: 10px; outline: none;
    }
    input[type=password]:focus { border-color: #4299e1; }
    .btn {
      width: 100%; padding: 11px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #3182ce; color: #fff; }
    .error { color: #e53e3e; font-size: 12px; margin-top: 6px; min-height: 16px; }

    /* ── dial ── */
    .sdk-row {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; margin-bottom: 20px;
    }
    .sdk-row i { font-size: 15px; }
    .status-badge {
      display: inline-block; padding: 4px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600; margin-bottom: 20px;
      background: #f7fafc; color: #4a5568;
    }
    .status-badge.active    { background: #fefcbf; color: #b7791f; }
    .status-badge.connected { background: #c6f6d5; color: #276749; }
    .dial-btn {
      width: 76px; height: 76px; border-radius: 50%; border: none;
      cursor: pointer; margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15); transition: transform .1s;
    }
    .dial-btn:active { transform: scale(0.95); }
    .dial-btn.idle   { background: #38a169; }
    .dial-btn.active { background: #e53e3e; }
    .dial-btn i { font-size: 30px; color: #fff; }
    .dial-hint { font-size: 12px; color: #718096; }
    .divider {
      display: flex; align-items: center; gap: 8px;
      margin: 18px 0 12px; color: #cbd5e0; font-size: 11px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #e2e8f0;
    }
    .phone-number {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      font-size: 18px; font-weight: 700; color: #2d3748; letter-spacing: .04em;
    }
    .phone-number i { font-size: 17px; color: #718096; }
    .copy-row {
      display: flex; align-items: center; gap: 6px;
      background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 7px 10px; margin-top: 14px; text-align: left;
    }
    .copy-url {
      flex: 1; font-size: 11px; color: #4a5568;
      font-family: 'SF Mono', 'Monaco', monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .copy-btn {
      flex-shrink: 0; background: none; border: none; cursor: pointer;
      color: #718096; padding: 2px; border-radius: 4px;
      display: flex; align-items: center; transition: color .15s;
    }
    .copy-btn:hover { color: #3182ce; }
    .copy-btn i { font-size: 15px; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .icon-spin { animation: spin 0.8s linear infinite; }

    @keyframes log-flash {
      0%   { background-color: #ebf8ff; }
      40%  { background-color: transparent; }
      70%  { background-color: #ebf8ff; }
      100% { background-color: transparent; }
    }
    .log-entry.new { animation: log-flash 3s ease-in-out; }

    /* ── log panel ── */
    #log-panel {
      width: 560px;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
    }
    #log-panel h2 {
      font-size: 14px; font-weight: 700; color: #1a202c;
      margin-bottom: 10px; flex-shrink: 0;
      display: flex; align-items: center; gap: 7px;
    }
    #log-panel h2 i { font-size: 16px; color: #4a5568; }
    #log-entries {
      flex: 1; overflow-y: auto;
      font-family: 'SF Mono', 'Monaco', 'Cascadia Code', monospace;
      font-size: 11px;
    }
    .log-entry { padding: 5px 0; border-bottom: 1px solid #f5f5f5; }
    .log-entry:last-child { border-bottom: none; }
    .log-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .log-time { color: #b0b8c1; font-size: 10px; flex-shrink: 0; }
    .log-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 5px;
      flex-shrink: 0;
    }
    .log-badge i { font-size: 12px; color: #fff; }
    .badge-call     { background: #3182ce; }
    .badge-cr       { background: #805ad5; }
    .badge-ai       { background: #38a169; }
    .badge-transfer { background: #dd6b20; }
    .badge-twiml    { background: #718096; }
    .badge-error    { background: #e53e3e; }
    .badge-clear    { background: #a0aec0; }
    .log-label { color: #2d3748; line-height: 1.4; }
    .log-detail {
      background: #f7fafc;
      border: 1px solid #e8edf2;
      border-radius: 4px;
      padding: 5px 8px;
      margin: 4px 0 2px 0;
      font-size: 10px;
      color: #4a5568;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 100px;
      overflow-y: auto;
    }
    .log-empty { color: #a0aec0; font-size: 12px; padding: 16px 0; text-align: center; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div id="demo-wrap">

  <!-- Login -->
  <div id="login-card" class="card" hidden>
    <h1>Teams Demo</h1>
    <p class="subtitle">Customer Experience Demo</p>
    <input type="password" id="pw" placeholder="Password" />
    <button class="btn btn-primary" onclick="doLogin()">Enter Demo</button>
    <div class="error" id="login-error"></div>
  </div>

  <!-- Dialler -->
  <div id="dial-card" class="card" hidden>
    <h1>Teams Demo</h1>
    <p class="subtitle">Voice SDK Client</p>
    <div class="sdk-row">
      <i class="ph ph-circle-dashed" id="sdk-icon" style="color:#a0aec0"></i>
      <span id="sdk-label">Initialising…</span>
    </div>
    <br>
    <span class="status-badge" id="status">Idle</span>
    <br>
    <button class="dial-btn idle" id="dial-btn" onclick="toggleCall()">
      <i class="ph ph-phone"></i>
    </button>
    <div class="dial-hint" id="hint">Tap to call</div>
    <div class="divider">or call via phone</div>
    <div class="phone-number">
      <i class="ph ph-phone-call"></i>
      <span id="demo-number">—</span>
    </div>

    <div id="wa-section" hidden>
      <div class="divider">or via WhatsApp</div>
      <div class="phone-number">
        <i class="ph ph-whatsapp-logo" style="color:#38a169"></i>
        <span id="wa-number">—</span>
      </div>
    </div>

    <div class="copy-row" title="WhatsApp inbound webhook URL">
      <i class="ph ph-link" style="font-size:14px;color:#718096;flex-shrink:0"></i>
      <span class="copy-url" id="wa-url">—</span>
      <button class="copy-btn" id="copy-btn" onclick="copyUrl()" title="Copy webhook URL">
        <i class="ph ph-copy" id="copy-icon"></i>
      </button>
    </div>
  </div>

  <!-- Live Log -->
  <div id="log-panel" hidden>
    <h2><i class="ph ph-activity"></i>Live Activity</h2>
    <div id="log-entries">
      <div class="log-empty" id="log-empty">Waiting for a call…</div>
    </div>
  </div>

</div>

<script>
  let device = null, call = null, es = null;

  // ── auth ──────────────────────────────────────────────────────────────────
  async function init() {
    try {
      const r = await fetch('/token');
      if (r.status === 401) { show('login-card'); return; }
      const { token, phoneNumber, whatsappNumber } = await r.json();
      showDialler(token, phoneNumber, whatsappNumber);
    } catch { show('login-card'); }
  }

  async function doLogin() {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }),
    });
    if (r.ok) {
      document.getElementById('login-card').hidden = true;
      const { token, phoneNumber } = await (await fetch('/token')).json();
      showDialler(token, phoneNumber, whatsappNumber);
    } else {
      document.getElementById('login-error').textContent = 'Incorrect password';
    }
  }

  function showDialler(token, phoneNumber, whatsappNumber) {
    document.getElementById('demo-number').textContent = phoneNumber || '—';
    document.getElementById('wa-url').textContent = window.location.origin + '/whatsapp-inbound';
    if (whatsappNumber) {
      document.getElementById('wa-number').textContent = whatsappNumber;
      show('wa-section');
    }
    show('dial-card');
    show('log-panel');
    setupDevice(token);
    connectLogStream();
  }

  function copyUrl() {
    const url = window.location.origin + '/whatsapp-inbound';
    navigator.clipboard.writeText(url).then(() => {
      const icon = document.getElementById('copy-icon');
      icon.className = 'ph ph-check';
      icon.style.color = '#38a169';
      setTimeout(() => {
        icon.className = 'ph ph-copy';
        icon.style.color = '';
      }, 2000);
    });
  }

  // ── Voice SDK ─────────────────────────────────────────────────────────────
  function setupDevice(token) {
    device = new Twilio.Device(token, { logLevel: 1 });
    device.on('registered', () => setSdk('ready', 'SDK Ready'));
    device.on('error',      (e) => { setSdk('error', 'SDK Error'); setStatus('Error: ' + e.message, ''); });
    device.register();
  }

  async function toggleCall() {
    if (call) { call.disconnect(); return; }
    setStatus('Connecting…', 'active');
    setBtn('active', 'ph ph-circle-notch icon-spin', 'Connecting…');
    try {
      call = await device.connect();
      call.on('accept',     () => { setStatus('In call', 'connected'); setBtn('active', 'ph ph-phone-x', 'Hang up'); });
      call.on('disconnect', () => { call = null; setStatus('Call ended', ''); setBtn('idle', 'ph ph-phone', 'Tap to call'); setTimeout(() => setStatus('Idle', ''), 3000); });
      call.on('error',      (e) => { call = null; setStatus('Error: ' + e.message, ''); setBtn('idle', 'ph ph-phone', 'Tap to call'); });
    } catch (e) {
      call = null; setStatus('Failed', ''); setBtn('idle', 'ph ph-phone', 'Tap to call');
    }
  }

  // ── Live Log ──────────────────────────────────────────────────────────────
  const TYPE_ICONS = {
    call:     'ph-phone-incoming',
    cr:       'ph-broadcast',
    ai:       'ph-robot',
    transfer: 'ph-arrow-circle-right',
    twiml:    'ph-code',
    error:    'ph-warning',
    clear:    'ph-arrows-clockwise',
  };

  const BADGE_CLASS = {
    call:     'badge-call',
    cr:       'badge-cr',
    ai:       'badge-ai',
    transfer: 'badge-transfer',
    twiml:    'badge-twiml',
    error:    'badge-error',
    clear:    'badge-clear',
  };

  function connectLogStream() {
    if (es) es.close();
    es = new EventSource('/log-stream');
    es.onmessage = (e) => {
      const event = JSON.parse(e.data);
      if (event.type === 'clear') { clearLog(); return; }
      addLogEntry(event);
    };
  }

  function clearLog() {
    document.getElementById('log-entries').innerHTML =
      '<div class="log-empty" id="log-empty">New call started…</div>';
  }

  function addLogEntry({ ts, type, label, detail }) {
    const empty = document.getElementById('log-empty');
    if (empty) empty.remove();

    const time      = new Date(ts).toLocaleTimeString('en-AU', { hour12: false });
    const badgeClass = BADGE_CLASS[type] || 'badge-twiml';
    const iconClass  = TYPE_ICONS[type]  || 'ph-dot';

    const entry = document.createElement('div');
    entry.className = 'log-entry new';
    setTimeout(() => entry.classList.remove('new'), 3000);
    entry.innerHTML =
      `<div class="log-meta">` +
        `<span class="log-time">${time}</span>` +
        `<span class="log-badge ${badgeClass}"><i class="ph ${iconClass}"></i></span>` +
        `<span class="log-label">${escHtml(label)}</span>` +
      `</div>` +
      (detail ? `<pre class="log-detail">${escHtml(detail.trim())}</pre>` : '');

    const container = document.getElementById('log-entries');
    container.prepend(entry);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── helpers ───────────────────────────────────────────────────────────────
  function show(id) { document.getElementById(id).hidden = false; }

  function setSdk(state, label) {
    const icon = document.getElementById('sdk-icon');
    if (state === 'ready') {
      icon.className = 'ph ph-check-circle';
      icon.style.color = '#38a169';
    } else if (state === 'error') {
      icon.className = 'ph ph-x-circle';
      icon.style.color = '#e53e3e';
    } else {
      icon.className = 'ph ph-circle-dashed';
      icon.style.color = '#a0aec0';
    }
    document.getElementById('sdk-label').textContent = label;
  }

  function setStatus(text, type) {
    const b = document.getElementById('status');
    b.textContent = text; b.className = 'status-badge ' + type;
  }

  function setBtn(state, iconClass, hint) {
    const b = document.getElementById('dial-btn');
    b.className = 'dial-btn ' + state;
    b.innerHTML = `<i class="ph ${iconClass}"></i>`;
    document.getElementById('hint').textContent = hint;
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    init();
  });
</script>
</body>
</html>
